[package]
name = "api-scraped-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6.5"
console_error_panic_hook = "0.1.7"
scraper.workspace = true
api-scraped = { workspace = true, features = ["tsify"] }
console_log = "1.0.0"
serde_json.workspace = true
log.workspace = true
