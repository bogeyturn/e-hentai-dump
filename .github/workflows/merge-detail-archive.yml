name: Merge Detail Into Archive

on:
  schedule:
    - cron: "13 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: merge-detail-archive
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout archive branch
        uses: actions/checkout@v4
        with:
          ref: archive
          path: repo
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github
            append.py
            archive
            build_item_index.py
            json_array.py
            merge_detail_archive.py
            replace.py

      - name: Checkout detail branch
        uses: actions/checkout@v4
        with:
          ref: detail
          path: detail-checkout
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: detail

      - name: Fetch master branch
        working-directory: repo
        run: git fetch --depth=1 --filter=blob:none origin master:refs/remotes/origin/master

      - name: Restore detail files
        working-directory: repo
        run: |
          mkdir -p detail
          rsync -a --delete "$GITHUB_WORKSPACE/detail-checkout/detail/" detail/

      - name: Merge detail into archive
        working-directory: repo
        run: python3 merge_detail_archive.py

      - name: Check archive changes
        id: archive_changes
        working-directory: repo
        run: |
          if git status --porcelain -- archive | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push archive changes
        if: steps.archive_changes.outputs.changed == 'true'
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive
          git commit -m "Merge detail into archive"
          git push origin HEAD:archive

      - name: Reset detail branch to master
        working-directory: repo
        run: git push --force-with-lease=refs/heads/detail origin origin/master:refs/heads/detail
