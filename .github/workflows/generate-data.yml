name: Generate and Commit Data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Checkout detail data
        uses: actions/checkout@v4
        with:
          ref: detail
          path: detail-branch
          fetch-depth: 1
          sparse-checkout: detail

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Restore detail data
        working-directory: repo
        run: |
          mkdir -p detail
          rsync -a --delete "$GITHUB_WORKSPACE/detail-branch/detail/" detail/

      - name: Run data generator
        working-directory: repo
        run: cargo run --release

      - name: Check for changes
        id: changes
        working-directory: repo
        run: |
          if git status --porcelain | grep -E '^( M|A |\?\?) (data/|detail/)'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data detail
          git commit -m "Update generated data"
          git push
