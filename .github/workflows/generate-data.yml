name: Generate Data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: generate-data
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github
            crates
            Cargo.lock
            Cargo.toml
            data
            detail_requests.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate RSS data files
        run: cargo run -p downloader --release -- data

      - name: Check for data changes
        id: changes
        run: |
          if git status --porcelain -- data detail_requests.json | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push data changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data detail_requests.json
          git commit -m "Update data"
          git push origin HEAD:data

      - name: Dispatch detail generation
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          requests="$(cat detail_requests.json)"
          if [ "$requests" = "[]" ]; then
            echo "No detail requests to dispatch."
            exit 0
          fi
          gh workflow run generate-detail.yml --ref detail -f requests_json="$requests"
